<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Codex · Remote</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body data-view="list"><header><span class="brand">Codex</span><div class="header-actions"><span id="connection" role="status">连接中</span><button id="theme" aria-label="切换到浅色模式" title="切换外观">☀</button><button id="quotaToggle" class="compact-only" popovertarget="quota" aria-label="查看额度">额度</button></div></header><main><aside aria-label="项目与对话"><div class="list-heading"><h2>项目与对话</h2></div><button id="newThread" class="new-thread">＋ 新建对话</button><label for="project">工作项目</label><select id="project"><option value="">全部项目</option></select><input id="search" placeholder="搜索对话" aria-label="搜索对话"><div class="section-label">对话</div><nav id="threads" aria-label="对话列表"></nav><button id="moreThreads" hidden>加载更多对话</button></aside><section class="chat"><div class="chat-head"><button id="back" class="mobile-only" aria-label="返回对话列表">‹ 对话</button><div class="chat-heading"><small>Codex</small><h1 id="title">选择一个对话</h1></div><button id="open" disabled>在桌面打开</button></div><div id="notice">正在连接本机 Codex…</div><button id="older" hidden>加载更早消息</button><div id="messages" role="log" aria-label="对话内容"><div class="empty">开始一段新对话<small>选择项目和对话，或新建对话</small></div></div><form id="composer"><textarea id="text" placeholder="给这个对话发送消息…" aria-label="消息" rows="2" disabled></textarea><div><div class="composer-meta"><div class="model-controls"><select id="model" aria-label="当前对话模型" disabled><option value="">模型</option></select><select id="effort" aria-label="思考强度" disabled><option value="">思考强度</option></select></div><span id="sendStatus">桌面 App 需保持运行</span></div><button id="send" aria-label="发送消息" disabled>↑</button></div></form></section><section class="quota" id="quota" aria-label="额度监控"><div class="quota-head"><h2>额度监控</h2><div class="quota-actions"><button id="refreshLimits">刷新</button><button id="closeQuota" class="compact-only" popovertarget="quota" popovertargetaction="hide" aria-label="关闭额度面板">关闭</button></div></div><div id="limits">读取中…</div><small id="quotaTime"></small></section></main><dialog id="newDialog" aria-labelledby="newDialogTitle"><form id="newForm"><div class="dialog-heading"><h2 id="newDialogTitle">新建对话</h2><button type="button" id="cancelNew" aria-label="关闭新建对话">×</button></div><label for="newProject">项目</label><select id="newProject" required><option value="" disabled selected>选择一个项目</option></select><label for="newModel">模型</label><select id="newModel"><option value="">使用默认模型</option></select><label for="newEffort">思考强度</label><select id="newEffort" disabled><option value="">默认</option></select><p id="createStatus" role="status">对话将在所选项目中创建。</p><button id="confirmNew" type="submit" class="primary">创建对话</button></form></dialog></body></html>
