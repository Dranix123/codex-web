<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Codex · Remote</title><link rel="stylesheet" href="/style.css"><script src="/choices.js" defer></script><script src="/app.js" defer></script></head><body data-view="list"><header><span class="brand">Codex</span><div class="header-actions"><span id="connection" role="status">连接中</span><button id="lock" type="button" title="锁定网页">锁定</button><button id="theme" aria-label="切换到浅色模式" title="切换外观">☀</button><button id="quotaToggle" class="compact-only" popovertarget="quota" aria-label="查看额度">额度</button></div></header><main><aside aria-label="项目与对话"><div class="list-heading"><h2>项目与对话</h2></div><button id="newThread" class="new-thread">＋ 新建对话</button><div class="project-heading"><label for="project">工作项目</label><button id="newProjectButton" aria-label="新建项目" title="新建项目">＋</button></div><select id="project"><option value="">全部项目</option></select><p id="projectNotice" role="status" hidden></p><input id="search" placeholder="搜索对话" aria-label="搜索对话"><div class="section-label">对话</div><nav id="threads" aria-label="对话列表"></nav><button id="moreThreads" hidden>加载更多对话</button></aside><section class="chat"><div class="chat-head"><button id="back" class="mobile-only" aria-label="返回对话列表">‹ 对话</button><div class="chat-heading"><small>Codex</small><h1 id="title">选择一个对话</h1></div><div class="chat-actions"><button id="downloadFiles" type="button" disabled>↓ 下载</button><button id="open" disabled>在桌面打开</button></div></div><div id="notice"></div><button id="older" hidden>加载更早消息</button><div id="messages" role="log" aria-label="对话内容"><div class="empty">开始一段新对话</div></div><form id="questions" hidden aria-label="Codex 待回答问题"></form><form id="composer"><div id="attachments" aria-label="待发送附件"></div><textarea id="text" placeholder="给这个对话发送消息…" aria-label="消息" rows="2" disabled></textarea><div><div class="composer-meta"><div class="model-controls"><button id="attach" type="button" aria-label="添加文件" title="添加文件" popovertarget="fileActions" disabled>＋</button><select id="model" aria-label="当前对话模型" disabled><option value="">模型</option></select><select id="effort" aria-label="思考强度" disabled><option value="">思考强度</option></select></div><span id="sendStatus"></span></div><button id="send" aria-label="发送消息" disabled>↑</button></div></form></section><section class="quota" id="quota" aria-label="额度监控"><div class="quota-head"><h2>额度监控</h2><div class="quota-actions"><button id="refreshLimits">刷新</button><button id="closeQuota" class="compact-only" popovertarget="quota" popovertargetaction="hide" aria-label="关闭额度面板">关闭</button></div></div><div id="limits">读取中…</div><small id="quotaTime"></small></section></main><dialog id="newDialog" aria-labelledby="newDialogTitle"><form id="newForm"><div class="dialog-heading"><h2 id="newDialogTitle">新建对话</h2><button type="button" id="cancelNew" aria-label="关闭新建对话">×</button></div><label for="newProject">项目</label><select id="newProject"><option value="" selected>无项目</option></select><button id="newProjectFromThread" type="button" class="text-button">＋ 新建项目</button><label for="newModel">模型</label><select id="newModel"><option value="">使用默认模型</option></select><label for="newEffort">思考强度</label><select id="newEffort" disabled><option value="">默认</option></select><p id="createStatus" role="status"></p><button id="confirmNew" type="submit" class="primary">创建对话</button></form></dialog><dialog id="projectDialog" aria-labelledby="projectDialogTitle"><form id="projectForm"><div class="dialog-heading"><h2 id="projectDialogTitle">新建项目</h2><button id="cancelProject" type="button" aria-label="关闭新建项目">×</button></div><label for="projectName">项目名称</label><input id="projectName" maxlength="128" required placeholder="项目名称"><label for="projectFolder">服务器文件夹</label><div class="folder-field"><input id="projectFolder" readonly required placeholder="选择文件夹"><button id="chooseFolder" type="button">选择文件夹</button></div><p id="projectStatus" role="status"></p><button id="confirmProject" type="submit" class="primary">创建项目</button></form></dialog><dialog id="filePicker" aria-labelledby="pickerTitle"><div class="dialog-heading"><h2 id="pickerTitle">选择文件</h2><button id="closePicker" type="button" aria-label="关闭文件选择器">×</button></div><form id="pathForm"><label for="pickerPath">服务器路径</label><div class="folder-field"><input id="pickerPath" autocomplete="off" spellcheck="false"><button id="goPath" type="submit">前往</button></div></form><div class="picker-shortcuts"><button id="pickerHome">个人文件夹</button><button id="pickerVolumes">磁盘</button><button id="pickerUp">上一级</button></div><label class="picker-visibility"><input id="showHidden" type="checkbox">显示隐藏项目</label><input id="pickerSearch" type="search" aria-label="筛选文件" placeholder="筛选当前文件夹"><div id="pickerEntries" aria-label="服务器文件列表"></div><p id="pickerStatus" role="status"></p><button id="useSelection" class="primary" disabled>选择此文件夹</button></dialog><div id="fileActions" popover="auto" aria-label="添加文件方式"><button id="attachLocal" type="button">附加服务器文件</button><button id="upload" type="button">上传文件</button></div><dialog id="uploadDialog" aria-labelledby="uploadTitle"><form id="uploadForm"><div class="dialog-heading"><h2 id="uploadTitle">上传并附加文件</h2><button id="cancelUpload" type="button" aria-label="关闭上传">×</button></div><label for="uploadFolder">保存到服务器文件夹</label><div class="folder-field"><input id="uploadFolder" readonly placeholder="选择目标文件夹"><button id="chooseUploadFolder" type="button">选择文件夹</button></div><label for="uploadFiles">文件</label><button id="chooseUploadFiles" type="button">选择文件</button><input id="uploadFiles" type="file" multiple hidden><div id="uploadQueue" aria-label="待上传文件"></div><p class="upload-note">单个文件最多 50 MB，重名自动改名。</p><p id="uploadStatus" role="status"></p><button id="confirmUpload" type="submit" class="primary" disabled>上传并附加</button></form></dialog></body></html>
